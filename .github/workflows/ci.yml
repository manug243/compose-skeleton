name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37"
      - name: Verify library and example
        run: ./gradlew :skeleton:testDebugUnitTest :skeleton:lintDebug :example:lintDebug :example:assembleDebug
