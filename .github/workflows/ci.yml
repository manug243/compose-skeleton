name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0"
      - name: Verify library and example
        run: ./gradlew :skeleton:desktopTest :skeleton:testAndroidHostTest :skeleton:lint :example:lintDebug :example:assembleDebug

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-37.0"
      - name: Test iOS target
        run: ./gradlew :skeleton:iosSimulatorArm64Test
