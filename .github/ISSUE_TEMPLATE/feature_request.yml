name: Feature request
description: Suggest a new feature or an API change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem before the solution. Features and API changes are discussed before implementation. Pull requests for unplanned API changes may be declined.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that the library does not support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
      description: A sketch of the API, parameter or behaviour you propose.
      render: kotlin
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today, or other approaches you considered.
    validations:
      required: false
